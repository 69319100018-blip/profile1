<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>talos · Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Video Background -->
  <div class="video-bg" aria-hidden="true">
    <video autoplay muted loop playsinline poster="photo.png">
      <source src="ssstik.io_@soul.blr_1779080280199.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="video-overlay" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <!-- Floating particles (always animating) -->
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- ========== HERO / PROFILE ========== -->
  <section class="hero">
    <article class="profile" aria-label="Profile card">
      <div class="banner">
        <video autoplay muted loop playsinline>
          <source src="ssstik.io_@soul.blr_1779080280199.mp4" type="video/mp4" />
        </video>
        <div class="views-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          soft
        </div>
      </div>

      <div class="profile-body">
        <div class="avatar-row">
          <div class="avatar">
            <img src="photo.png" alt="prasitchok" />
          </div>
          <div class="name-block">
            <h1>talos</h1>
            <p class="tagline">quiet soul · soft nights</p>
          </div>
        </div>

        <p class="bio">
          ดูๆไปก่อน ตอนนี้คิดอะไรไม่ออก<br />
          
        </p>

        <nav class="socials" aria-label="Social links">
          <a href="https://www.instagram.com/etml_1/?hl=en" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1.15"/>
            </svg>
          </a>
          <a href="https://www.facebook.com/prasitchok.chinarin" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H8v3h3v7h3v-7h3l1-3h-4V9c0-.6.4-1 1-1z"/>
            </svg>
          </a>
          <a href="https://open.spotify.com/user/315b37264nlsnpndjd7tzvykpffi?si=e87f2262fc4d4c30" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <path class="wave" d="M7 9.2c3.4-1 7.2-.7 10.1.6M7.8 12.2c2.8-.7 5.9-.5 8.3.5M8.7 15c2.1-.4 4.4-.2 6.3.5"/>
            </svg>
          </a>
        </nav>

        <!-- Music player locked under bio -->
        <div class="player" role="region" aria-label="Music player">
          <div class="player-cover">
            <img src="photo.png" alt="" />
          </div>
          <div class="player-info">
            <div class="player-meta">
              <div class="player-title">Drag Path</div>
              <div class="player-artist">Twenty One Pilots</div>
            </div>
            <div class="progress-wrap">
              <span class="time" id="currentTime">0:00</span>
              <div class="progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-bar" id="progressBar"></div>
              </div>
              <span class="time end" id="duration">3:44</span>
            </div>
          </div>
          <div class="player-controls">
            <button class="ctrl-btn vol-btn" id="muteBtn" aria-label="Mute / Unmute" title="ปิดเสียง">
              <svg id="volIcon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zm7.07 1.93a9 9 0 0 1 0 10.14M15.54 8.46a5 5 0 0 1 0 7.08"/></svg>
            </button>
            <button class="ctrl-btn play-btn" id="playBtn" aria-label="Play / Pause" title="เล่น / หยุด">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </article>

    <div class="scroll-hint" aria-hidden="true">
      <span>scroll</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </div>
  </section>

  <!-- ========== WORKS / PORTFOLIO ========== -->
  <section class="works" id="works" aria-label="ผลงาน">
    <header class="works-header reveal">
      <h2>ผลงาน · Works</h2>
      <p>game clips · fiveM · photos · moments</p>
    </header>

    <div class="works-grid">
      <!-- Clip 1 -->
      <article class="work-card reveal">
        <div class="work-media">
          <img src="image.png" alt="talos" loading="lazy" />
        </div>
        <div class="work-info">
          <h3></h3>
          <p>character · still</p>
          <span class="work-tag">Art</span>
        </div>
      </article>

      <!-- Clip 2 -->
      <article class="work-card reveal">
        <div class="work-media">
          <img src="image1.png" alt="talos" loading="lazy" />
        </div>
        <div class="work-info">
          <h3></h3>
          <p>character · still</p>
          <span class="work-tag">Art</span>
        </div>
      </article>

      <!-- Light City still -->
      <article class="work-card reveal">
        <div class="work-media">
          <img src="work-lightcity.png" alt="FiveM Light City" loading="lazy" />
        </div>
        <div class="work-info">
          <h3></h3>
          <p>FiveM by Cfx.re · frame capture</p>
          <span class="work-tag">Screenshot</span>
        </div>
      </article>

      <!-- talos -->
      <article class="work-card reveal">
        <div class="work-media">
          <img src="talos.png" alt="talos" loading="lazy" />
        </div>
        <div class="work-info">
          <h3></h3>
          <p>character · still</p>
          <span class="work-tag">Art</span>
        </div>
      </article>

  </section>

  <audio id="audio" preload="metadata" loop>
    <source src="Twenty One Pilots - Drag Path (Lyrics).mp3" type="audio/mpeg" />
  </audio>

  <script>
    /* ----- Music player ----- */
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const muteBtn = document.getElementById('muteBtn');
    const volIcon = document.getElementById('volIcon');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    const playSvg = '<path d="M8 5v14l11-7z"/>';
    const pauseSvg = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    const volOnSvg = '<path d="M11 5L6 9H2v6h4l5 4V5zm7.07 1.93a9 9 0 0 1 0 10.14M15.54 8.46a5 5 0 0 1 0 7.08"/>';
    const volOffSvg = '<path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/>';

    function formatTime(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = pct + '%';
      progress.setAttribute('aria-valuenow', Math.round(pct));
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      volIcon.innerHTML = audio.muted ? volOffSvg : volOnSvg;
      muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute');
    });

    progress.addEventListener('click', (e) => {
      const rect = progress.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = Math.max(0, Math.min(1, x)) * audio.duration;
    });

    audio.addEventListener('pause', () => { playIcon.innerHTML = playSvg; });
    audio.addEventListener('play', () => { playIcon.innerHTML = pauseSvg; });

    /* ----- Scroll reveal ----- */
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    reveals.forEach((el) => io.observe(el));

    /* ----- Work videos: play on hover / click ----- */
    document.querySelectorAll('.work-card[data-video]').forEach((card) => {
      const vid = card.querySelector('video');
      if (!vid) return;

      const syncPlaying = () => {
        card.classList.toggle('is-playing', !vid.paused);
      };

      vid.addEventListener('play', syncPlaying);
      vid.addEventListener('pause', syncPlaying);
      vid.addEventListener('ended', syncPlaying);

      card.addEventListener('mouseenter', () => {
        vid.play().catch(() => {});
      });
      card.addEventListener('mouseleave', () => {
        vid.pause();
        vid.currentTime = 0;
      });

      card.addEventListener('click', () => {
        if (vid.paused) {
          vid.play().catch(() => {});
        } else {
          vid.pause();
        }
      });
    });

    /* ----- Floating particles (always on) ----- */
    const particlesEl = document.getElementById('particles');
    const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 18;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (12 + Math.random() * 18) + 's';
      p.style.animationDelay = (Math.random() * -20) + 's';
      p.style.width = p.style.height = (1.5 + Math.random() * 2.5) + 'px';
      p.style.opacity = 0.2 + Math.random() * 0.4;
      particlesEl.appendChild(p);
    }

    /* Hide scroll hint after user scrolls */
    const hint = document.querySelector('.scroll-hint');
    let hintHidden = false;
    window.addEventListener('scroll', () => {
      if (!hintHidden && window.scrollY > 80) {
        hint.style.opacity = '0';
        hint.style.transition = 'opacity 0.4s ease';
        hintHidden = true;
      }
    }, { passive: true });

    /* ----- Full-scene parallax (bg + card + layers) ----- */
    const profile = document.querySelector('.profile');
    const bannerVid = document.querySelector('.banner video');
    const bgVideo = document.querySelector('.video-bg video');
    const avatar = document.querySelector('.avatar');
    const profileBody = document.querySelector('.profile-body');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (profile && !reduceMotion) {
      let scrollY = 0;
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;
      let rafId = null;

      function applyParallax() {
        const sx = targetX;
        const sy = targetY;
        const sc = scrollY;

        // 1) Background video — deepest layer (moves most with mouse, least with scroll feel)
        if (bgVideo) {
          const bx = sx * -28;
          const by = sy * -22 + sc * 0.15;
          bgVideo.style.transform = `translate3d(${bx}px, ${by}px, 0) scale(1.14)`;
        }

        // 2) Profile card — mid layer + 3D tilt
        const rotY = sx * 8;
        const rotX = sy * -6;
        const cardX = sx * 14;
        const cardY = sy * 10 + sc * 0.28;
        profile.style.transform =
          `translate3d(${cardX}px, ${cardY}px, 0) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

        // 3) Banner video inside card — opposite direction (depth inside glass)
        if (bannerVid) {
          const bnx = sx * -18;
          const bny = sy * -14 - sc * 0.06;
          bannerVid.style.transform = `translate3d(${bnx}px, ${bny}px, 0) scale(1.12)`;
        }

        // 4) Avatar — floats slightly toward cursor
        if (avatar) {
          const ax = sx * 10;
          const ay = sy * 8;
          avatar.style.transform = `translate3d(${ax}px, ${ay}px, 20px)`;
        }

        // 5) Body text / socials / player — lighter shift
        if (profileBody) {
          const px = sx * 4;
          const py = sy * 3;
          profileBody.style.transform = `translate3d(${px}px, ${py}px, 10px)`;
        }

        rafId = null;
      }

      function requestTick() {
        if (rafId == null) rafId = requestAnimationFrame(applyParallax);
      }

      window.addEventListener('scroll', () => {
        scrollY = window.scrollY;
        requestTick();
      }, { passive: true });

      // mouse parallax across whole viewport (not only hero)
      window.addEventListener('mousemove', (e) => {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        mouseX = (e.clientX - cx) / (window.innerWidth / 2);
        mouseY = (e.clientY - cy) / (window.innerHeight / 2);
        mouseX = Math.max(-1, Math.min(1, mouseX));
        mouseY = Math.max(-1, Math.min(1, mouseY));
        profile.classList.add('is-tilting');
        requestTick();
      }, { passive: true });

      // smooth lerp loop
      function lerpLoop() {
        targetX += (mouseX - targetX) * 0.08;
        targetY += (mouseY - targetY) * 0.08;
        if (
          Math.abs(mouseX - targetX) > 0.001 ||
          Math.abs(mouseY - targetY) > 0.001 ||
          scrollY > 0
        ) {
          requestTick();
        }
        requestAnimationFrame(lerpLoop);
      }
      lerpLoop();
    }
  </script>
</body>
</html>
